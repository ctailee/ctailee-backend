name: Go CI

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Go checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CGO_ENABLED: '0'
      GOFLAGS: -mod=readonly

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Check formatting
        shell: bash
        run: |
          unformatted=$(gofmt -l cmd internal migrations)
          if [ -n "$unformatted" ]; then
            printf 'Run gofmt on these files:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Static analysis
        run: go vet ./...

      - name: Test
        run: go test -count=1 ./...

      - name: Build
        run: go build ./...

  publish:
    name: Publish Docker image
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read project metadata
        id: metadata
        shell: bash
        run: |       
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          git_commit="${GITHUB_SHA::7}"

          echo "commitImage=${image}:${git_commit}" >> "$GITHUB_OUTPUT"
          echo "latestImage=${image}:latest" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          docker build \
          -t ${{ steps.metadata.outputs.commitImage }} \
          -t ${{ steps.metadata.outputs.latestImage }} \
          .

      - name: Push image
        run: |
          docker push ${{ steps.metadata.outputs.commitImage }}
          docker push ${{ steps.metadata.outputs.latestImage }}