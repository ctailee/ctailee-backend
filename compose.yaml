name: ctailee-backend

services:
  app:
    image: ghcr.io/ctailee/ctailee-backend:latest

    pull_policy: always

    ports:
      - "8080:8080"

    environment:
      DATABASE_URL: jdbc:sqlite:/app/data/production.sqlite
      JPA_SHOW_SQL: "false"

    volumes:
      - sqlite-volume:/app/data

    restart: unless-stopped

volumes:
  sqlite-volume: